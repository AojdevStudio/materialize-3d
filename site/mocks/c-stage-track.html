<!doctype html>

     the pitch, the rendered test sign as the hero object, download under it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock C: stage track</title>
<style>
@font-face { font-family: "DM Sans"; src: url("../src/assets/fonts/DMSans-Regular.ttf"); font-weight: 400; }
