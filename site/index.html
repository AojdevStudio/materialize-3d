<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Materialize 3D: describe a part, print the 3MF</title>
    <meta
      name="description"
      content="A Mac app where you talk to an AI agent about a part. It shows the model and an assembly guide as it works, and ends with a print-ready 3MF for Bambu Studio."
    />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the remembered theme before first paint. Light is the default.
      try {
        if (localStorage.getItem("m3d-theme") === "dark") document.documentElement.dataset.theme = "dark";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
