<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Materialize 3D: describe a part, print the 3MF</title>
    <meta
      name="description"
      content="Materialize 3D is a Mac app where you describe a 3D-printable object in a chat, and an agent makes it. The agent writes the model, previews it, and slices it to a print-ready 3MF for your printer."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/brand/mark-small-32.svg" />
    <script>
      // Apply the remembered theme before first paint. Light is the default.
      try {
        if (localStorage.getItem("m3d-theme") === "dark") document.documentElement.dataset.theme = "dark";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
