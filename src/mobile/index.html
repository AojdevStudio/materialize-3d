<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Materialize 3D</title>
    <script>
      document.documentElement.dataset.theme = localStorage.getItem('materialize-3d.theme') === 'dark' ? 'dark' : 'light'
    </script>
    <style>
      html[data-theme='dark'] { background: #000; color-scheme: dark; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
