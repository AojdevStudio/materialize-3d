[package]
name = "materialize-3d-mobile"
version = "0.3.2"
license = "MIT"
description = "Materialize 3D for iPhone and iPad"
authors = ["AOJ Dev Studio"]
edition = "2021"

[lib]
name = "materialize_3d_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# The desktop crate's Tauri release line. See src-tauri/Cargo.toml.
tauri-build = { version = "~2.7.4", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "~2.12.5", features = [] }
thiserror = "1"
url = "2"
# The Keychain on iOS. Other targets get keyring's in-memory store, which the tests use.
keyring = { version = "3", features = ["apple-native"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
