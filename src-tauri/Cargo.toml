[package]
name = "materialize-3d"
version = "0.1.0"
description = "Materialize 3D desktop app"
authors = ["AOJ Dev Studio"]
edition = "2021"

[lib]
name = "materialize_3d_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["devtools", "unstable"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
rumqttc = { version = "0.24", features = ["use-rustls"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
rustls-pemfile = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
thiserror = "1"
url = "2"
zip = "2"
quick-xml = "0.38"
tempfile = "3"
suppaftp = { version = "6", features = ["native-tls", "deprecated"] }
md5 = "0.7"
native-tls = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2.6.0"

# fabrication
earcutr = "0.5"
i_overlay = "9"
sha2 = "0.10"
tiny-skia = "0.12"
ttf-parser = "0.25"
usvg = { version = "0.48", default-features = false }

# OS-native credential store: Keychain (macOS), Credential Manager (Windows),
# Secret Service (Linux).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3", features = ["linux-native"] }
