[package]
name = "materialize-3d"
version = "0.3.1"
license = "MIT"
description = "Materialize 3D desktop app"
authors = ["AOJ Dev Studio"]
edition = "2021"

[lib]
name = "materialize_3d_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Tauri crates stay on one release line. A newer line's runtime crates can fall
# inside an older tauri's version ranges without compiling against it, so every
# crate of the line is bounded here; patch releases within the line still update.
tauri-build = { version = "~2.7.4", features = [] }

[features]
# Verification harness for driving the app on macOS; never enabled in release builds.
e2e = ["dep:axum", "dep:objc2", "dep:objc2-web-kit", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:block2"]

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "~2.12.5", features = ["devtools", "unstable"] }
tauri-runtime = "~2.12.2"
tauri-runtime-wry = "~2.12.3"
tauri-utils = "~2.10.2"
tauri-macros = "~2.7.4"
tauri-codegen = "~2.7.4"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["full"] }
dirs = "5"
thiserror = "1"
url = "2"
tempfile = "3"
tauri-plugin-dialog = "~2.6.0"
# The zip feature only unpacks Windows installers and pulls in zip 4, which carries advisories. macOS updates are .tar.gz.
tauri-plugin-updater = { version = "~2.12.0", default-features = false, features = ["rustls-tls", "system-proxy"] }

# studio: the m3dfile:// protocol
percent-encoding = "2"
# the slice step: reading a sliced 3MF's slice_info.config
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
# the slice step: Bambu Studio's presets, flattened and cached
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
# the e2e harness's local HTTP server
axum = { version = "0.8", optional = true }

[dev-dependencies]
tauri = { version = "~2.12.5", features = ["test"] }
# the updater tests' local release feed
axum = "0.8"

# OS-native credential store: Keychain (macOS), Credential Manager (Windows),
# Secret Service (Linux).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
objc2 = { version = "0.6", optional = true }
objc2-web-kit = { version = "0.3", optional = true, features = ["WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }
objc2-app-kit = { version = "0.3", optional = true, features = ["NSImage", "NSBitmapImageRep", "NSImageRep"] }
objc2-foundation = { version = "0.3", optional = true, features = ["NSData", "NSDictionary", "NSError"] }
block2 = { version = "0.6", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

# The sidecar's process group and its signals.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

