[package]
name = "materialize-3d"
version = "0.1.0"
license = "MIT"
description = "Materialize 3D desktop app"
authors = ["AOJ Dev Studio"]
edition = "2021"

[lib]
name = "materialize_3d_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Tauri crates stay on one release line. The 2.12 runtime crates fall inside
# tauri 2.11's version ranges but do not compile against it, so every crate of
# the line is bounded here; patch releases within the line still update.
tauri-build = { version = "~2.6.3", features = [] }

[features]
# Verification harness for driving the app on macOS; never enabled in release builds.
e2e = ["dep:objc2", "dep:objc2-web-kit", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:block2"]
# The CAD worker's Linux test backend (QEMU microvm on KVM), for the self-hosted Linux runner. The macOS release
# never enables it, so it cannot ship.
linux-cad-test = []

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "~2.11.6", features = ["devtools", "unstable"] }
tauri-runtime = "~2.11.3"
tauri-runtime-wry = "~2.11.4"
tauri-utils = "~2.9.3"
tauri-macros = "~2.6.3"
tauri-codegen = "~2.6.3"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
rumqttc = { version = "0.24", features = ["use-rustls"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
rustls-pemfile = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
thiserror = "1"
url = "2"
zip = "2"
quick-xml = "0.38"
tempfile = "3"
suppaftp = { version = "6", features = ["native-tls", "deprecated"] }
md5 = "0.7"
native-tls = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "~2.6.0"

# fabrication
earcutr = "0.5"
i_overlay = "9"
sha2 = "0.10"
tiny-skia = "0.12"
ttf-parser = "0.25"
usvg = { version = "0.48", default-features = false }
# local HTTP servers: the MCP endpoint and the e2e harness
axum = "0.8"

# in-app agent
futures = "0.3"
rig = "=0.42.0"
schemars = "1"
tokio-util = { version = "0.7", features = ["rt"] }

# mcp
rmcp = { version = "=3.4.1", features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
subtle = "2"

[dev-dependencies]
jsonschema = { version = "0.33", default-features = false }
rig = { version = "=0.42.0", features = ["test-utils"] }
tauri = { version = "~2.11.6", features = ["test"] }
# Generates src/types/generated.ts from the Rust types the frontend reads; see tools::frontend_types.
ts-rs = "12"

# OS-native credential store: Keychain (macOS), Credential Manager (Windows),
# Secret Service (Linux).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
objc2 = { version = "0.6", optional = true }
objc2-web-kit = { version = "0.3", optional = true, features = ["WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }
objc2-app-kit = { version = "0.3", optional = true, features = ["NSImage", "NSBitmapImageRep", "NSImageRep"] }
objc2-foundation = { version = "0.3", optional = true, features = ["NSData", "NSDictionary", "NSError"] }
block2 = { version = "0.6", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

# openat and fstat for reading a build's views without following symlinks; the CAD worker's Linux backend too.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

