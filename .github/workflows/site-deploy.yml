# Deploys the landing site to Cloudflare Pages production (project materialize-3d) when a push to main
# touches site/. This is not part of ci.yml because ci.yml cancels an in-flight run on main when the
# next push lands, and a push that does not touch site/ would then cancel the deploy.
#
# The job runs only on a push to main and never for Dependabot. docs/ci-runners.md explains the guards
# that keep fork pull requests off the self-hosted runners.
name: Site deploy

on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/site-deploy.yml

concurrency:
  group: site-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy the landing site
    if: github.event_name == 'push' && github.actor != 'dependabot[bot]'
    # The Playwright tests launch the installed Google Chrome, which only the Mac mini has.
    runs-on: [self-hosted, macOS, ARM64, m3d-mac-vz]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      # No later step uses git, so the job's token stays out of the git config while dependency scripts run.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # A job-local bun, for the same reason as the macos job's setup-bun in ci.yml.
      - uses: oven-sh/setup-bun@v2
        env:
          HOME: ${{ runner.temp }}/bun-home
        with:
          bun-version: "1.4.4"
      - name: The Cloudflare secrets are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::The repository secret $name is empty. Add it in Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          exit "$missing"
      - name: Install site dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Build and test layout, links, keyboard access, contrast, and claims
        run: bunx playwright test
      # The Playwright run builds dist/ for /materialize-3d/. Pages serves the site from /, so build again
      # with SITE_BASE unset.
      - name: Build for Pages
        run: bun run build
      - name: Deploy to Cloudflare Pages production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4.153.0 pages deploy dist --project-name materialize-3d --branch main
