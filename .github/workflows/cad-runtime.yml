# CAD runtime: the reproducible guest images, and the CAD helper's restriction
# tests against Apple's real Virtualization framework. Both of those jobs run on
# a machine we own (setup in docs/ci-runners.md), so two guards keep pull requests
# from forks off them:
#   1. The repository's fork approval policy, all_external_contributors: no
#      workflow run from a fork starts until a maintainer approves it, and a
#      maintainer approves only after reading every change under .github/.
#      Agents never approve one. This guard holds even when a fork edits this
#      file, because a pull request runs the workflow files from its own head.
#   2. Each job's `if:` admits only a push to main, a manual dispatch, or a pull
#      request whose head branch is in this repository, so an approved fork run
#      that leaves this file alone still skips these jobs. It also refuses
#      Dependabot, as the actor and as a pull request's author: the runners run
#      as a host user whose gh login the runner guard uses, so a dependency
#      update's code must not run there. A person regenerates the pins for a
#      Dependabot lock bump on their own branch, where these jobs run.
# A third guard sits outside the jobs: scripts/ci/runner-guard.sh on each runner
# host stops that host's runner if the policy ever reads differently.
#
# The two part-kind jobs build the app's `part` kind on a real CAD backend and
# slice with the real Bambu Studio: the amd64 image under QEMU's microvm machine
# on the Linux runner (the app's `linux-cad-test` feature, which no release
# enables), and the arm64 image on Apple's Virtualization framework on the Mac.
#
# Every job runs on every event, so its check-run exists on every pull request.
# The images job decides once, for the images and helper jobs, how much work this
# run does:
#   none   a pull request that changes nothing the runtime is built, bundled, or
#          tested from (scripts/ci/cad-runtime-paths.txt): both jobs pass in seconds.
#   reuse  a pull request whose runtime key (scripts/ci/cad-runtime-key.sh) has a
#          record from a run where both jobs did their full work and passed: both
#          jobs pass and print that run's id and the key.
#   full   everything else. Pushes to main and manual runs always do the full work.
# It decides the same way, separately, for the two part-kind jobs (`backend_work`),
# over the runtime inputs and the app's inputs together
# (scripts/ci/cad-backend-paths.txt, `--backend` in both scripts), so a change to
# the app alone runs the part-kind jobs and rebuilds no image. When the images job
# builds nothing but the part-kind jobs do full work, it hands them the pinned
# runtime from the runner host's cache (scripts/ci/cad-runtime-cache.sh), checked
# against the committed pins, and builds it there only on a cache miss.
# The record is the artifact cad-runtime-pass-<key> that the record job uploads
# after a full run in which both jobs passed, and cad-backend-pass-<key> after a
# full run in which both part-kind jobs passed. The record job needs all four
# jobs, so a run with any failed job records nothing. The lookup trusts a record
# only through its run (docs/ci-runners.md says who can write one). The record job is the one
# job here on a GitHub-hosted runner: it runs no build and holds no secret.
name: CAD runtime

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cad-runtime-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  images:
    name: CAD runtime images reproduce
    if: >-
      github.actor != 'dependabot[bot]' && (
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: [self-hosted, Linux, X64, m3d-linux-kvm]
    timeout-minutes: 150
    # actions: read lets the lookup list artifacts and read their runs.
    permissions:
      contents: read
      actions: read
    outputs:
      work: ${{ steps.work.outputs.work }}
      key: ${{ steps.key.outputs.key }}
      source_run: ${{ steps.work.outputs.source_run }}
      done: ${{ steps.done.outputs.done }}
      backend_work: ${{ steps.backend_work.outputs.work }}
      backend_key: ${{ steps.backend_key.outputs.key }}
      backend_source_run: ${{ steps.backend_work.outputs.source_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The runtime key follows the listed inputs, and scope reads the same list
        run: scripts/ci/test/cad-runtime-key.sh
      - name: The part-kind key and scope cover the app too, and the image key does not
        run: scripts/ci/test/cad-backend-scope.sh
      - name: Every file the app compiles in or its tests read is on the part-kind lists
        run: scripts/ci/test/cad-backend-inputs.sh
      - name: The runtime cache hands out only the pinned runtime
        run: scripts/ci/test/cad-runtime-cache.sh
      - name: Does this change touch the CAD runtime?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci/cad-runtime-scope.sh "$EVENT" "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"
      - name: The CAD runtime key
        id: key
        if: steps.scope.outputs.relevant == 'true'
        run: scripts/ci/cad-runtime-key.sh >> "$GITHUB_OUTPUT"
      # Only a pull request looks for a record. Any lookup failure is a miss, and
      # the run then does the full work.
      - name: Decide this run's work for both jobs
        id: work
        env:
          EVENT: ${{ github.event_name }}
          RELEVANT: ${{ steps.scope.outputs.relevant }}
          KEY: ${{ steps.key.outputs.key }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs
        run: |
          if [[ "$RELEVANT" != true ]]; then
            echo "work=none" >> "$GITHUB_OUTPUT"
            echo "No CAD runtime path changed; the image builds are skipped and this check passes." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$EVENT" == pull_request ]] && found="$(scripts/ci/cad-runtime-key.sh lookup "$REPO")" \
            && [[ "$found" == *"key=$KEY" ]]; then
            source_run="$(sed -n 's/^source_run=//p' <<< "$found")"
            printf 'work=reuse\nsource_run=%s\n' "$source_run" >> "$GITHUB_OUTPUT"
            printf 'CAD runtime reused: run %s passed both jobs with full work under the key %s (%s/%s). The image builds are skipped and this check passes.\n' \
              "$source_run" "$KEY" "$RUN_URL" "$source_run" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "work=full" >> "$GITHUB_OUTPUT"
          fi
      - name: Do the part-kind jobs' inputs change?
        id: backend_scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci/cad-runtime-scope.sh --backend "$EVENT" "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"
      - name: The part-kind key
        id: backend_key
        if: steps.backend_scope.outputs.relevant == 'true'
        run: scripts/ci/cad-runtime-key.sh --backend >> "$GITHUB_OUTPUT"
      - name: Decide this run's work for the part-kind jobs
        id: backend_work
        env:
          EVENT: ${{ github.event_name }}
          RELEVANT: ${{ steps.backend_scope.outputs.relevant }}
          KEY: ${{ steps.backend_key.outputs.key }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs
        run: |
          if [[ "$RELEVANT" != true ]]; then
            echo "work=none" >> "$GITHUB_OUTPUT"
            echo "No part-kind input changed; the part-kind jobs pass without building." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$EVENT" == pull_request ]] && found="$(scripts/ci/cad-runtime-key.sh --backend lookup "$REPO")" \
            && [[ "$found" == *"key=$KEY" ]]; then
            source_run="$(sed -n 's/^source_run=//p' <<< "$found")"
            printf 'work=reuse\nsource_run=%s\n' "$source_run" >> "$GITHUB_OUTPUT"
            printf 'Part-kind jobs reused: run %s passed both with full work under the key %s (%s/%s).\n' \
              "$source_run" "$KEY" "$RUN_URL" "$source_run" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "work=full" >> "$GITHUB_OUTPUT"
          fi
      - name: The runner host has Docker, buildx, and arm64 binfmt
        if: steps.work.outputs.work == 'full'
        run: scripts/ci/check-image-host.sh
      - name: Two clean arm64 builds match each other and pins-arm64.json
        if: steps.work.outputs.work == 'full'
        run: cad-runtime/reproduce.sh arm64
      - name: Two clean amd64 builds match each other and pins-amd64.json
        if: steps.work.outputs.work == 'full'
        run: cad-runtime/reproduce.sh amd64
      - name: A rebuild from the same inputs reuses the tools image and the kernel
        if: steps.work.outputs.work == 'full'
        run: cad-runtime/test/kernel-stamp.sh amd64
      - name: Record the digests
        if: steps.work.outputs.work == 'full'
        run: |
          {
            echo "### CAD runtime digests"
            for arch in arm64 amd64; do
              printf '\n#### %s\n\n```json\n%s\n```\n' "$arch" "$(cat "cad-runtime/out/$arch/pins.json")"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the reproduced runtime in the host cache for later runs
        if: steps.work.outputs.work == 'full'
        run: |
          scripts/ci/cad-runtime-cache.sh store arm64 cad-runtime/out/arm64
          scripts/ci/cad-runtime-cache.sh store amd64 cad-runtime/out/amd64
      - name: The pinned runtime for the part-kind jobs, from the host cache
        if: steps.work.outputs.work != 'full' && steps.backend_work.outputs.work == 'full'
        run: |
          # A cache miss builds the runtime here, which needs the same host tools as the full work.
          scripts/ci/check-image-host.sh
          rm -rf cad-runtime/out/arm64 cad-runtime/out/amd64
          scripts/ci/cad-runtime-cache.sh fetch arm64 cad-runtime/out/arm64
          scripts/ci/cad-runtime-cache.sh fetch amd64 cad-runtime/out/amd64
      - name: Hand the arm64 runtime to the Mac jobs
        if: steps.work.outputs.work == 'full' || steps.backend_work.outputs.work == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: cad-runtime-arm64
          path: |
            cad-runtime/out/arm64/Image
            cad-runtime/out/arm64/rootfs.img
            cad-runtime/out/arm64/job.img
            cad-runtime/out/arm64/hostile-initramfs.cpio
            cad-runtime/out/arm64/pins.json
          if-no-files-found: error
          retention-days: 7
      - name: Hand the amd64 runtime to the Linux part-kind job
        if: steps.backend_work.outputs.work == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: cad-runtime-amd64
          path: |
            cad-runtime/out/amd64/vmlinux
            cad-runtime/out/amd64/rootfs.img
            cad-runtime/out/amd64/job.img
            cad-runtime/out/amd64/pins.json
          if-no-files-found: error
          retention-days: 7
      # Set only when every step above ran and passed; the record job reads it.
      - name: The full work is done
        id: done
        if: steps.work.outputs.work == 'full'
        run: echo "done=true" >> "$GITHUB_OUTPUT"

  helper:
    name: CAD helper restriction tests
    needs: images
    if: >-
      github.actor != 'dependabot[bot]' && (
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: [self-hosted, macOS, ARM64, m3d-mac-vz]
    timeout-minutes: 60
    defaults:
      run:
        working-directory: cad-host
    outputs:
      done: ${{ steps.done.outputs.done }}
    env:
      WORK: ${{ needs.images.outputs.work }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: The images job decided this run's work
        if: env.WORK != 'none' && env.WORK != 'reuse' && env.WORK != 'full'
        run: |
          echo "::error::The images job gave no work decision ('$WORK')."
          exit 1
      - name: Nothing the CAD runtime is built, bundled, or tested from changed
        if: env.WORK == 'none'
        run: echo "No CAD runtime path changed; the restriction tests are skipped and this check passes." >> "$GITHUB_STEP_SUMMARY"
      - name: Reuse the passed run with the same runtime key
        if: env.WORK == 'reuse'
        env:
          SOURCE_RUN: ${{ needs.images.outputs.source_run }}
          KEY: ${{ needs.images.outputs.key }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs
        run: |
          printf 'CAD runtime reused: run %s passed both jobs with full work under the key %s (%s/%s). The restriction tests are skipped and this check passes.\n' \
            "$SOURCE_RUN" "$KEY" "$RUN_URL" "$SOURCE_RUN" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v4
        if: env.WORK == 'full'
        with:
          name: cad-runtime-arm64
          path: cad-runtime/out/arm64
      - name: Library tests
        if: env.WORK == 'full'
        run: cargo test --locked
      - name: Clippy, including the macOS VM driver, with and without the restriction-test command
        if: env.WORK == 'full'
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --features restriction-tests -- -D warnings
      - name: A release helper has no hostile command
        if: env.WORK == 'full'
        run: |
          cargo build --release --locked
          code=0
          target/release/materialize-cad-host hostile --runtime ../cad-runtime/out/arm64 --case valid --out out/no-hostile \
            > /dev/null || code=$?
          test "$code" = 64
      - name: Build the helper with the restriction-test command and sign it ad hoc with the virtualization entitlement
        if: env.WORK == 'full'
        run: |
          cargo build --release --locked --features restriction-tests
          codesign -s - -f --options runtime --entitlements entitlements.plist target/release/materialize-cad-host
      - name: The runtime matches the pins compiled into the helper
        if: env.WORK == 'full'
        run: target/release/materialize-cad-host verify --runtime ../cad-runtime/out/arm64
      - name: Ten restriction tests on the real Virtualization framework
        if: env.WORK == 'full'
        run: >
          HELPER="$PWD/target/release/materialize-cad-host" RUNTIME="$PWD/../cad-runtime/out/arm64"
          restriction-tests/run-all.sh out/restriction-tests.log
      - name: The cable clip builds through both guests into a closed mesh
        if: env.WORK == 'full'
        run: |
          target/release/materialize-cad-host build --runtime ../cad-runtime/out/arm64 \
            --source spike/cable-clip-fillet-first.py --params spike/cable-clip.params.json --out out/clip
          jq -e '.outcome == "accepted" and (.bodies | length) == 1 and .bodies[0].mesh.closed_manifold
            and .bodies[0].mesh.non_degenerate and .bodies[0].mesh.outward' out/clip/result.json
      # Set only when every step above ran and passed; the record job reads it.
      - name: The full work is done
        id: done
        if: env.WORK == 'full'
        run: echo "done=true" >> "$GITHUB_OUTPUT"
      - name: Keep the logs
        if: always() && env.WORK == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: cad-helper-logs
          path: |
            cad-host/out/restriction-tests.log
            cad-host/out/clip/result.json
          if-no-files-found: ignore
          retention-days: 14

  part-linux:
    name: CAD part kind on the Linux backend
    needs: images
    if: >-
      github.actor != 'dependabot[bot]' && (
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: [self-hosted, Linux, X64, m3d-linux-kvm]
    timeout-minutes: 90
    defaults:
      run:
        working-directory: src-tauri
    outputs:
      done: ${{ steps.done.outputs.done }}
    env:
      WORK: ${{ needs.images.outputs.backend_work }}
      # Outside the checkout, which actions/checkout cleans, so a run reuses the last one's build.
      CARGO_TARGET_DIR: ${{ github.workspace }}/../m3d-target-part-linux
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: The images job decided this run's work
        if: env.WORK != 'none' && env.WORK != 'reuse' && env.WORK != 'full'
        run: |
          echo "::error::The images job gave no part-kind work decision ('$WORK')."
          exit 1
      - name: Nothing the part-kind jobs build or test from changed
        if: env.WORK == 'none'
        run: echo "No part-kind input changed; the part-kind tests are skipped and this check passes." >> "$GITHUB_STEP_SUMMARY"
      - name: Reuse the passed run with the same part-kind key
        if: env.WORK == 'reuse'
        env:
          SOURCE_RUN: ${{ needs.images.outputs.backend_source_run }}
          KEY: ${{ needs.images.outputs.backend_key }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs
        run: |
          printf 'Part-kind jobs reused: run %s passed both with full work under the key %s (%s/%s). The tests are skipped and this check passes.\n' \
            "$SOURCE_RUN" "$KEY" "$RUN_URL" "$SOURCE_RUN" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v4
        if: env.WORK == 'full'
        with:
          name: cad-runtime-amd64
          path: cad-runtime/out/amd64
      - name: The runner can boot a microVM (KVM, vhost-vsock, QEMU)
        if: env.WORK == 'full'
        run: |
          test -r /dev/kvm -a -w /dev/kvm || { echo "the runner user cannot open /dev/kvm (add it to the kvm group)"; exit 1; }
          test -w /dev/vhost-vsock || { echo "the runner user cannot open /dev/vhost-vsock"; exit 1; }
          qemu-system-x86_64 --version
      # Before Bambu Studio is installed: its BAMBU_STUDIO_CLI in the job environment would override the setting
      # the missing-Bambu-Studio unit test stores.
      - name: Unit tests with the Linux test backend compiled in
        if: env.WORK == 'full'
        run: cargo test --lib --locked --features linux-cad-test -- fabrication actions
      - name: Install Bambu Studio 02.08.02.61
        if: env.WORK == 'full'
        working-directory: .
        run: scripts/ci/install-bambu-linux.sh
      - name: Proof parts, support warnings, a failing fillet, and a hostile script, on the real backend and slicer
        if: env.WORK == 'full'
        env:
          M3D_CAD_RUNTIME: ${{ github.workspace }}/cad-runtime/out/amd64
        run: >
          cargo test --lib --locked --features linux-cad-test fabrication::kinds::part::backend_tests
          -- --ignored --nocapture --test-threads=1
      # Set only when every step above ran and passed; the record job reads it.
      - name: The full work is done
        id: done
        if: env.WORK == 'full'
        run: echo "done=true" >> "$GITHUB_OUTPUT"

  part-macos:
    name: CAD part kind on the macOS backend
    needs: images
    if: >-
      github.actor != 'dependabot[bot]' && (
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: [self-hosted, macOS, ARM64, m3d-mac-vz]
    timeout-minutes: 90
    defaults:
      run:
        working-directory: src-tauri
    outputs:
      done: ${{ steps.done.outputs.done }}
    env:
      WORK: ${{ needs.images.outputs.backend_work }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/../m3d-target-part-macos
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: The images job decided this run's work
        if: env.WORK != 'none' && env.WORK != 'reuse' && env.WORK != 'full'
        run: |
          echo "::error::The images job gave no part-kind work decision ('$WORK')."
          exit 1
      - name: Nothing the part-kind jobs build or test from changed
        if: env.WORK == 'none'
        run: echo "No part-kind input changed; the part-kind tests are skipped and this check passes." >> "$GITHUB_STEP_SUMMARY"
      - name: Reuse the passed run with the same part-kind key
        if: env.WORK == 'reuse'
        env:
          SOURCE_RUN: ${{ needs.images.outputs.backend_source_run }}
          KEY: ${{ needs.images.outputs.backend_key }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs
        run: |
          printf 'Part-kind jobs reused: run %s passed both with full work under the key %s (%s/%s). The tests are skipped and this check passes.\n' \
            "$SOURCE_RUN" "$KEY" "$RUN_URL" "$SOURCE_RUN" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v4
        if: env.WORK == 'full'
        with:
          name: cad-runtime-arm64
          path: cad-runtime/out/arm64
      - name: Build the release helper and sign it ad hoc with the virtualization entitlement
        if: env.WORK == 'full'
        working-directory: cad-host
        run: |
          cargo build --release --locked --target-dir ../../m3d-target-cad-host
          cp ../../m3d-target-cad-host/release/materialize-cad-host "$RUNNER_TEMP/materialize-cad-host"
          codesign -s - -f --options runtime --entitlements entitlements.plist "$RUNNER_TEMP/materialize-cad-host"
      - name: Install Bambu Studio 02.08.02.61
        if: env.WORK == 'full'
        working-directory: .
        run: scripts/ci/install-bambu-macos.sh
      - name: Proof parts, support warnings, a failing fillet, and a hostile script, on the real backend and slicer
        if: env.WORK == 'full'
        env:
          M3D_CAD_HELPER: ${{ runner.temp }}/materialize-cad-host
          M3D_CAD_RUNTIME: ${{ github.workspace }}/cad-runtime/out/arm64
        run: >
          cargo test --lib --locked fabrication::kinds::part::backend_tests
          -- --ignored --nocapture --test-threads=1
      - name: The app binary builds the cable clip with the helper and runtime laid out as in the bundle
        if: env.WORK == 'full'
        run: |
          cargo build --locked
          app="$RUNNER_TEMP/self-test/Materialize 3D.app"
          rm -rf "$RUNNER_TEMP/self-test"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources/cad-runtime"
          cp "$CARGO_TARGET_DIR/debug/materialize-3d" "$RUNNER_TEMP/materialize-cad-host" "$app/Contents/MacOS/"
          for file in Image rootfs.img job.img; do
            ln -s "$GITHUB_WORKSPACE/cad-runtime/out/arm64/$file" "$app/Contents/Resources/cad-runtime/$file"
          done
          "$app/Contents/MacOS/materialize-3d" --cad-self-test "$RUNNER_TEMP/self-test/out" > "$RUNNER_TEMP/self-test/clip.json"
          jq -e '.build == "verified" and .step_inside_package' "$RUNNER_TEMP/self-test/clip.json"
      # Set only when every step above ran and passed; the record job reads it.
      - name: The full work is done
        id: done
        if: env.WORK == 'full'
        run: echo "done=true" >> "$GITHUB_OUTPUT"

  # Writes the records a later pull request reuses, each an artifact in this run
  # that holds its key and this run's id:
  #   cad-runtime-pass-<key>   when the images and helper jobs both did their full work
  #   cad-backend-pass-<key>   when the two part-kind jobs both did their full work
  # It needs all four jobs, so it runs only when all four passed (the implicit
  # success() in `if:`), and a failure in any of them records nothing. Each job sets
  # `done` only after its full work, so a cancelled, skipped, or reused job never
  # yields a record, and a reuse cannot stand in for a run that never passed. It
  # carries the same guard as the other jobs, so a fork or Dependabot run never
  # writes a record.
  record:
    name: CAD runtime pass record
    needs: [images, helper, part-linux, part-macos]
    if: >-
      github.actor != 'dependabot[bot]' && (
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FULL: ${{ needs.images.outputs.done == 'true' && needs.helper.outputs.done == 'true' }}
      BACKEND_FULL: ${{ needs.part-linux.outputs.done == 'true' && needs.part-macos.outputs.done == 'true' }}
    steps:
      - name: Nothing to record for the images unless both image jobs did their full work
        if: env.FULL != 'true'
        env:
          WORK: ${{ needs.images.outputs.work }}
        run: echo "This run's image work was '$WORK', not the full work in both jobs, so it records no CAD runtime pass." >> "$GITHUB_STEP_SUMMARY"
      - name: Nothing to record for the part kind unless both part-kind jobs did their full work
        if: env.BACKEND_FULL != 'true'
        env:
          WORK: ${{ needs.images.outputs.backend_work }}
        run: echo "This run's part-kind work was '$WORK', not the full work in both jobs, so it records no part-kind pass." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: env.FULL == 'true' || env.BACKEND_FULL == 'true'
        with:
          persist-credentials: false
      - name: Write the record for this run's key
        id: record
        if: env.FULL == 'true'
        env:
          IMAGES_KEY: ${{ needs.images.outputs.key }}
        run: |
          out="$(scripts/ci/cad-runtime-key.sh record "$GITHUB_RUN_ID" cad-runtime-pass-record.txt)"
          if [[ "$out" != "key=$IMAGES_KEY" ]]; then
            rm -f cad-runtime-pass-record.txt
            echo "::error::This checkout's $out differs from the images job's key '$IMAGES_KEY'; nothing is recorded."
            exit 1
          fi
          echo "$out" >> "$GITHUB_OUTPUT"
          printf 'Recorded run %s under the CAD runtime key %s.\n' "$GITHUB_RUN_ID" "${out#key=}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload the record
        if: env.FULL == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cad-runtime-pass-${{ steps.record.outputs.key }}
          path: cad-runtime-pass-record.txt
          # A re-run keeps the run id and its earlier artifacts; replace the
          # record under the same name, which is the name the lookup searches for.
          overwrite: true
          if-no-files-found: error
          retention-days: 90
      - name: Write the part-kind record for this run's key
        id: backend_record
        if: env.BACKEND_FULL == 'true'
        env:
          BACKEND_KEY: ${{ needs.images.outputs.backend_key }}
        run: |
          out="$(scripts/ci/cad-runtime-key.sh --backend record "$GITHUB_RUN_ID" cad-backend-pass-record.txt)"
          if [[ "$out" != "key=$BACKEND_KEY" ]]; then
            rm -f cad-backend-pass-record.txt
            echo "::error::This checkout's part-kind $out differs from the images job's part-kind key '$BACKEND_KEY'; nothing is recorded."
            exit 1
          fi
          echo "$out" >> "$GITHUB_OUTPUT"
          printf 'Recorded run %s under the part-kind key %s.\n' "$GITHUB_RUN_ID" "${out#key=}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload the part-kind record
        if: env.BACKEND_FULL == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cad-backend-pass-${{ steps.backend_record.outputs.key }}
          path: cad-backend-pass-record.txt
          overwrite: true
          if-no-files-found: error
          retention-days: 90
