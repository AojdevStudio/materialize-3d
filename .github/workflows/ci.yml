# Required gates for every PR. Every job in this file runs on a machine we own
# and installs its own toolchain.
#
# These jobs and the ones in cad-runtime.yml run on the runners set up in
# docs/ci-runners.md. Two guards keep a pull request from a fork off them:
#   1. The fork approval policy, all_external_contributors: no workflow run
#      from a fork starts until a maintainer approves it, and a maintainer
#      approves only after reading every change under .github/. Agents never
#      approve one. A fork's pull request runs the workflow files from its own
#      head, so this is the guard that holds when a fork edits them.
#   2. Every self-hosted job runs only on a push to main, a manual dispatch, or
#      a pull request whose head branch is in this repository
#      (github.event.pull_request.head.repo.full_name == github.repository),
#      and never for Dependabot, as the actor or as a pull request's author.
# Outside the jobs, scripts/ci/runner-guard.sh on each runner host reads the
# policy every 5 minutes and stops that host's runner if it ever changes.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux build and checks
    if: >-
      github.actor != 'dependabot[bot]' && (
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: [self-hosted, Linux, X64, m3d-linux-kvm]
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: actions/setup-node@v6.2.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.7"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # A cache save on this persistent runner would otherwise delete cargo-installed tools from ~/.cargo/bin.
          cache-bin: false
          # Only main saves. A pull request restores main's entry and saves none, so it adds no copy to the cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install JavaScript dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Frontend tests
        run: bun run test
      - name: Frontend build
        run: bun run build
      - name: The frontend build carries no verification override
        run: "! grep -rl __M3D_E2E_DIALOGS__ dist"
      - name: Slicer package tests
        working-directory: packages/bambu-slicer
        run: bun test
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib --locked
      - name: Rust doc tests (compile-time proofs)
        working-directory: src-tauri
        run: cargo test --doc --locked
      - name: Install Bambu Studio 02.08.02.61
        run: |
          sudo apt-get install -y --no-install-recommends \
            libgstreamer-plugins-base1.0-0 libgstreamer-gl1.0-0 libegl1 libgl1 libgbm1 \
            libsecret-1-0 libmanette-0.2-0 libenchant-2-2 libhyphen0 libunwind8
          scripts/ci/install-bambu-linux.sh
      - name: Sign fabrication with real Bambu Studio (input immutability, multicolor, placement, revision integrity)
        working-directory: src-tauri
        run: cargo test --lib --locked fabrication::pipeline -- --ignored --nocapture --test-threads=1
      - name: Caller identity, approval enforcement, app ACL, and MCP boundary
        working-directory: src-tauri
        run: >
          cargo test --lib --locked -- --include-ignored --test-threads=1
          caller_identity_tests acl_tests mcp::tests fabrication::revisions
          agent::tests::the_model_is_offered_exactly_the_registry_and_no_approval_tool

  macos:
    name: macOS desktop build gate
    if: >-
      github.actor != 'dependabot[bot]' && (
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: [self-hosted, macOS, ARM64, m3d-mac-vz]
    timeout-minutes: 60
    env:
      # Node's default heap limit can be too small for the production
      # frontend build.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6.2.0
        with:
          node-version: "24"
      # Every runner on the Mac runs as one user, and setup-bun installs into $HOME/.bun/bin. Another
      # repository's job rewriting that bun mid-run makes macOS kill this job's next bun with SIGKILL, so
      # this job installs its own bun under the runner's per-job temp directory.
      - uses: oven-sh/setup-bun@v2
        env:
          HOME: ${{ runner.temp }}/bun-home
        with:
          bun-version: "1.3.7"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # A cache save on this persistent runner would otherwise delete cargo-installed tools from ~/.cargo/bin.
          cache-bin: false
          # Only main saves. A pull request restores main's entry and saves none, so it adds no copy to the cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install JavaScript dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Frontend tests
        run: bun run test
      - name: Slicer package tests
        working-directory: packages/bambu-slicer
        run: bun test
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib --locked
      - name: Install Bambu Studio 02.08.02.61
        run: scripts/ci/install-bambu-macos.sh
      - name: Sign fabrication with real Bambu Studio (input immutability, multicolor, placement, revision integrity)
        working-directory: src-tauri
        run: cargo test --lib --locked fabrication::pipeline -- --ignored --nocapture --test-threads=1
      - name: Caller identity, approval enforcement, app ACL, and MCP boundary
        working-directory: src-tauri
        run: >
          cargo test --lib --locked -- --include-ignored --test-threads=1
          caller_identity_tests acl_tests mcp::tests fabrication::revisions
          agent::tests::the_model_is_offered_exactly_the_registry_and_no_approval_tool
      - name: Build the desktop app (release profile)
        run: bun tauri build --bundles app
      - name: The release app carries no verification harness or dialog override
        run: |
          app="${CARGO_TARGET_DIR:-src-tauri/target}/release/bundle/macos/Materialize 3D.app"
          test -x "$app/Contents/MacOS/materialize-3d"
          if strings "$app/Contents/MacOS/materialize-3d" | grep -E "M3D_E2E_(TOKEN|PORT|DATA_DIR)"; then
            echo "release binary contains the e2e harness" >&2
            exit 1
          fi
          if grep -rl __M3D_E2E_DIALOGS__ dist; then
            echo "release frontend contains the scripted dialog override" >&2
            exit 1
          fi

  site:
    name: Landing site
    if: >-
      github.actor != 'dependabot[bot]' && (
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: [self-hosted, Linux, X64, m3d-linux-kvm]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.7"
      - name: Install site dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: bunx playwright install --with-deps chromium
      - name: Build and test layout, links, keyboard access, contrast, and claims
        run: bunx playwright test
