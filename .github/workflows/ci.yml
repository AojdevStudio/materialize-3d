# Required gates for every PR. Every job in this file runs on a machine we own
# and installs its own toolchain.
#
# These jobs run on the runners set up in docs/ci-runners.md. Two guards keep
# a pull request from a fork off them:
#   1. The fork approval policy, all_external_contributors: no workflow run
#      from a fork starts until a maintainer approves it, and a maintainer
#      approves only after reading every change under .github/. Agents never
#      approve one. A fork's pull request runs the workflow files from its own
#      head, so this is the guard that holds when a fork edits them.
#   2. Every self-hosted job runs only on a push to main or a pull request
#      whose head branch is in this repository
#      (github.event.pull_request.head.repo.full_name == github.repository),
#      and never for Dependabot, as the actor or as a pull request's author.
# Outside the jobs, scripts/ci/runner-guard.sh on each runner host reads the
# policy every 5 minutes and stops that host's runner if it ever changes.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux build and checks
    if: >-
      github.actor != 'dependabot[bot]' && (
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: [self-hosted, Linux, X64, m3d-linux-kvm]
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system libraries
        run: scripts/ci/install-tauri-libs.sh
      - uses: ./.github/actions/shared-checks
      - name: Release facts match their sources
        run: bun scripts/release/release-facts.ts && bun test scripts/release
      - name: CI installs system packages only through scripts/ci/install-tauri-libs.sh
        run: bun test scripts/ci
      # Here and not in formal-verification.yml, whose own paths list decides whether it runs, so a PR that edits
      # that list could skip the check of that list.
      - name: The TLA+ workflow paths are the files the models cover
        run: bun .agents/skills/formal-verify-materialize-3d/scripts/check-paths.ts
      - name: Frontend build
        run: bun run build
      - name: The frontend build carries no verification harness
        run: bun scripts/release/check-no-e2e-harness.ts
      # tauri-build refuses to build the app crate, tests included, until the bundled sidecar exists.
      - name: Build the sidecar
        run: scripts/build-sidecar.sh
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib --locked
      - name: Install the validated Bambu Studio
        run: scripts/ci/install-bambu-linux.sh
      - name: The agent's slice step with real Bambu Studio (P2S presets and plate, staged output)
        working-directory: src-tauri
        run: cargo test --lib --locked studio::slice -- --ignored --nocapture

  # The iPhone and iPad app's crate builds Tauri on its own, so its tests run beside the Linux job, not inside its hour.
  mobile:
    name: Mobile app checks
    if: >-
      github.actor != 'dependabot[bot]' && (
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: [self-hosted, Linux, X64, m3d-linux-kvm]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system libraries
        run: scripts/ci/install-tauri-libs.sh
      - uses: actions/setup-node@v6.2.0
        with:
          node-version: "24"
      - uses: ./.github/actions/setup-bun
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-mobile
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install JavaScript dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      # The crate embeds the mobile window build, so that build comes first.
      - name: Mobile window build
        run: bun run build:mobile
      - name: Mobile Rust tests
        working-directory: src-mobile
        run: cargo test --lib --locked

  macos:
    name: macOS desktop build gate
    if: >-
      github.actor != 'dependabot[bot]' && (
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: [self-hosted, macOS, ARM64, m3d-mac-vz]
    concurrency:
      group: ci-macos-desktop-build
      queue: max
    timeout-minutes: 60
    env:
      # Node's default heap limit can be too small for the production frontend build.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/shared-checks
      # The Rust tests run before the release build, because tauri build can rewrite Cargo.toml and
      # Cargo.lock. Its beforeBuildCommand builds the sidecar again, which takes under a second.
      - name: Build the sidecar
        run: scripts/build-sidecar.sh
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib --locked
      - name: Install the validated Bambu Studio
        run: scripts/ci/install-bambu-macos.sh
      - name: The agent's slice step with real Bambu Studio (P2S presets and plate, staged output)
        working-directory: src-tauri
        run: cargo test --lib --locked studio::slice -- --ignored --nocapture
      - name: Build the desktop app (release profile)
        run: bun tauri build --bundles app
      - name: The release app carries no verification harness
        run: |
          product="$(bun -p "require('./src-tauri/tauri.conf.json').productName")"
          bun scripts/release/check-no-e2e-harness.ts "${CARGO_TARGET_DIR:-src-tauri/target}/release/bundle/macos/$product.app"

  site:
    name: Landing site
    if: >-
      github.actor != 'dependabot[bot]' && (
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'))
    # The Playwright tests launch the installed Google Chrome, which this runner has.
    runs-on: [self-hosted, macOS, ARM64, m3d-mac-vz]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - name: Install site dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Google Chrome is installed on the runner
        run: '"/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version'
      - name: Build and test layout, links, keyboard access, contrast, and claims
        run: bunx playwright test
