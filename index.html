<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/brand/mark-small-16.svg" />
    <title>Materialize 3D</title>
    <!-- The saved theme before the first paint, so a dark choice never flashes light. src/studio/theme.ts owns it after. -->
    <script>
      document.documentElement.dataset.theme = localStorage.getItem('materialize-3d.theme') === 'dark' ? 'dark' : 'light'
    </script>
    <!-- The page is black from the first paint in dark, before studio.css loads. -->
    <style>
      html[data-theme='dark'] { background: #000; color-scheme: dark; }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
