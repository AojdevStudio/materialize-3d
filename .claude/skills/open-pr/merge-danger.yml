name: merge-danger

# Scores every same-repo PR's merge danger the same way, whoever wrote it, and posts the
# `merge-danger` commit status on the exact head. land-pr reads that status at merge time.
# pull_request_target runs this workflow and score.ts from the default branch, so a PR cannot
# change its own score. The job reads Jev's key from /etc/merge-danger/typesafe_api_key on the
# runner (ROLLOUT.md), not from a repo secret, and holds a token that writes statuses. So it
# checks out the default branch only and reads the PR through the event payload and the API.
# Never check out or run the PR's code here.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  statuses: write

concurrency:
  group: merge-danger-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  score:
    name: Merge danger
    # Fork and Dependabot PRs skip this check, so they never run on our runners.
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    # The homelab Linux runners, never the Mac minis. This job does not take the pr-kit label,
    # which can name any self-hosted runner.
    runs-on: [self-hosted, Linux, homelab-ci]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
        env:
          HOME: ${{ runner.temp }}/setup-bun
      - run: bun .claude/skills/open-pr/score.ts --event "$GITHUB_EVENT_PATH"
        env:
          GITHUB_TOKEN: ${{ github.token }}
